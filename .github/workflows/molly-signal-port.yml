name: Molly on Signal 8.33.2

on:
  pull_request:
    paths:
      - '.github/workflows/molly-signal-port.yml'
      - 'patches/molly-signal-8.33.2/**'
      - 'tools/827/**'
  push:
    paths:
      - '.github/workflows/molly-signal-port.yml'
      - 'patches/molly-signal-8.33.2/**'
      - 'tools/827/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: molly-signal-port-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  GIT_LFS_SKIP_SMUDGE: '1'

jobs:
  reconstruct-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out the patch forest and validation tools
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the port source history
        run: |
          git fetch --no-tags https://github.com/0cwa/mollyim-android.git \
            refs/heads/port/molly-signal-8.33.2:refs/remotes/port-source/molly-signal-8.33.2

      - name: Reconstruct and verify the complete pinned source
        run: |
          python3 tools/827/verify_complete.py \
            --repo . --patches patches/molly-signal-8.33.2 \
            --worktree "$RUNNER_TEMP/molly-signal-port" \
            --report "$RUNNER_TEMP/molly-signal-port-reports/source.json"

      - name: Set up JDK 21
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-read-only: true

      - name: Install the source's Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            'platforms;android-37.0' \
            'build-tools;36.0.0' \
            'ndk;28.0.13004108'
          df -h "$RUNNER_TEMP" "$GITHUB_WORKSPACE" \
            | tee "$RUNNER_TEMP/molly-signal-port-reports/build-capacity.txt"

      - name: Build the Website debug APK with strict dependency verification
        working-directory: ${{ runner.temp }}/molly-signal-port
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --no-parallel --no-configuration-cache --max-workers=1 \
            --dependency-verification=strict \
            --init-script "$GITHUB_WORKSPACE/tools/827/test-worker-heap.init.gradle" \
            -Pkotlin.compiler.execution.strategy=in-process \
            -Dorg.gradle.jvmargs='-Xmx8g -Xms256m -XX:MaxMetaspaceSize=1g -Dcom.android.tools.r8.threadCount=1 -XX:+UnlockExperimentalVMOptions -XX:hashCode=3' \
            :app:assembleProdWebsiteDebug \
            2>&1 | tee "$RUNNER_TEMP/molly-signal-port-reports/assemble.log"

      - name: Test proxy policy, MollySocket, registration, encrypted preferences, backups, and settings
        working-directory: ${{ runner.temp }}/molly-signal-port
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --no-parallel --no-configuration-cache --max-workers=1 \
            --dependency-verification=strict \
            --init-script "$GITHUB_WORKSPACE/tools/827/test-worker-heap.init.gradle" \
            -Pkotlin.compiler.execution.strategy=in-process \
            -Dorg.gradle.jvmargs='-Xmx8g -Xms256m -XX:MaxMetaspaceSize=1g -Dcom.android.tools.r8.threadCount=1 -XX:+UnlockExperimentalVMOptions -XX:hashCode=3' \
            :core:network:test \
            --tests org.signal.network.config.ProxyConfigTest \
            --tests org.signal.network.config.LibSignalProxyPolicyTest \
            :lib:libsignal-service:test \
            --tests org.whispersystems.signalservice.api.SignalServiceAccountManagerLinkedRegistrationTest \
            :feature:registration:testDebugUnitTest \
            --tests org.signal.registration.RegistrationRepositoryTest \
            --tests org.signal.registration.screens.phonenumber.PhoneNumberEntryViewModelTest \
            --tests org.signal.registration.screens.verificationcode.VerificationCodeViewModelTest \
            --tests org.signal.registration.screens.welcome.WelcomeScreenViewModelTest \
            :app:testProdWebsiteDebugUnitTest \
            --tests org.thoughtcrime.securesms.keyvalue.MollySettingsMigrationTest \
            --tests org.thoughtcrime.securesms.net.ConnectivityStateCalculatorTest \
            --tests org.thoughtcrime.securesms.backup.MollyBackupPreferencesTest \
            --tests org.thoughtcrime.securesms.backup.FullBackupExporterTest \
            --tests org.thoughtcrime.securesms.backup.FullBackupImporterTest \
            --tests org.thoughtcrime.securesms.notifications.NotificationIdsTest \
            --tests org.thoughtcrime.securesms.service.MessageBackupListenerTest \
            --tests org.thoughtcrime.securesms.components.settings.app.appearance.AppearanceSettingsViewModelTest \
            --tests org.thoughtcrime.securesms.components.settings.app.account.AccountSettingsViewModelTest \
            --tests org.thoughtcrime.securesms.components.settings.app.data.DataAndStorageSettingsViewModelTest \
            --tests org.thoughtcrime.securesms.components.settings.app.updates.AppUpdatesSettingsViewModelTest \
            --tests org.thoughtcrime.securesms.jobs.FcmRefreshJobTest \
            --tests org.thoughtcrime.securesms.jobs.UnifiedPushRefreshJobTest \
            --tests org.thoughtcrime.securesms.delete.DeleteAccountViewModelTest \
            --tests org.thoughtcrime.securesms.registration.v2.AppRegistrationStorageControllerTest \
            :feature:app-settings:testDebugUnitTest \
            --tests org.signal.appsettings.updates.AppUpdatesSettingsScreenTest \
            2>&1 | tee "$RUNNER_TEMP/molly-signal-port-reports/focused-tests.log"

      - name: Upload source verification, APKs, test results, and failure reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: molly-signal-8.33.2-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/molly-signal-port-reports
            ${{ runner.temp }}/molly-signal-port/**/build/reports
            ${{ runner.temp }}/molly-signal-port/**/build/test-results
            ${{ runner.temp }}/molly-signal-port/app/build/outputs/apk/prodWebsite/debug
